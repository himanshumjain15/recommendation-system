[theme]
base = "dark"
primaryColor = "#E50914"
backgroundColor = "#0B0B0B"
secondaryBackgroundColor = "#1A1A1A"
textColor = "#F5F5F5"
borderColor = "#2B2B2B"
linkColor = "#E50914"
linkUnderline = false
baseRadius = "4px"
buttonRadius = "4px"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap"
baseFontSize = 16
headingFontSizes = ["54px", "30px", "22px", "18px", "16px", "14px"]
headingFontWeights = [900, 800, 800, 700, 700, 700]
