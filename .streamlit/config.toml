[theme]
base = "dark"
primaryColor = "#E50914"
backgroundColor = "#0B0B0B"
secondaryBackgroundColor = "#1A1A1A"
textColor = "#F5F5F5"
borderColor = "#2B2B2B"
linkColor = "#E50914"
linkUnderline = false
baseRadius = "4px"
buttonRadius = "4px"

font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap"
baseFontSize = 16
headingFontSizes = ["56px", "30px", "22px", "18px", "16px", "14px"]
headingFontWeights = [900, 800, 800, 700, 700, 700]
